name: Statue Reconstruction
on:
  push:
    branches:
      - tmp-statue-reconstruction-20260926
  workflow_dispatch:
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reconstruction dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "gradio_client>=1.8,<2" "trimesh>=4.4" "numpy<3" pillow scipy networkx pygltflib
      - name: Run multiview reconstruction
        run: python .tmp-statue/reconstruct.py
      - name: Verify final model
        run: |
          test -s .tmp-statue/output/STATUE_FINAL_ULTRAFIDEL.glb
          python - <<'PY'
          import trimesh
          p = '.tmp-statue/output/STATUE_FINAL_ULTRAFIDEL.glb'
          s = trimesh.load(p, force='scene', process=False)
          n_v = sum(len(g.vertices) for g in s.geometry.values())
          n_f = sum(len(g.faces) for g in s.geometry.values())
          print({'vertices': n_v, 'faces': n_f})
          assert n_v > 1000 and n_f > 1000
          PY
      - name: Upload final 3D file
        uses: actions/upload-artifact@v4
        with:
          name: STATUE_FINAL_ULTRAFIDEL
          path: .tmp-statue/output/STATUE_FINAL_ULTRAFIDEL.glb
          if-no-files-found: error
          retention-days: 7
