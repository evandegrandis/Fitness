name: Statue Reconstruction
on:
  push:
    branches:
      - tmp-statue-reconstruction-20260926
  workflow_dispatch:
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reconstruction dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "transformers>=4.48" "trimesh>=4.4" "numpy<3" pillow scipy scikit-image matplotlib networkx pygltflib
      - name: Run multiview reconstruction
        run: python .tmp-statue/reconstruct.py
      - name: Verify final model
        run: |
          test -s .tmp-statue/output/STATUE_FINAL_ULTRAFIDEL.glb
          python - <<'PY'
          import trimesh, json
          p='.tmp-statue/output/STATUE_FINAL_ULTRAFIDEL.glb'
          s=trimesh.load(p,force='scene',process=False)
          nv=sum(len(g.vertices) for g in s.geometry.values())
          nf=sum(len(g.faces) for g in s.geometry.values())
          print(json.dumps({'vertices':nv,'faces':nf,'geometries':len(s.geometry)},indent=2))
          assert nv>5000 and nf>5000
          PY
      - name: Upload final 3D file
        uses: actions/upload-artifact@v4
        with:
          name: STATUE_FINAL_ULTRAFIDEL
          path: .tmp-statue/output/STATUE_FINAL_ULTRAFIDEL.glb
          if-no-files-found: error
          retention-days: 7
      - name: Upload reconstruction QA
        uses: actions/upload-artifact@v4
        with:
          name: STATUE_RECONSTRUCTION_QA
          path: |
            .tmp-statue/output/qa_*.png
            .tmp-statue/output/mask_*.png
            .tmp-statue/output/depth_*.png
            .tmp-statue/output/metadata.json
          if-no-files-found: warn
          retention-days: 7
